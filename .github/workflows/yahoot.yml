# Pipeline fuer das Modulprojekt Yahoot.
# Auf jedem Branch: bauen, alle Tests ausfuehren, Reports ablegen, Docker-Image bauen.
# Nur auf main: das getestete Image zusaetzlich veroeffentlichen.

name: yahoot

on:
  push:
    paths:
      - 'Yahoot/**'
      - '.github/workflows/yahoot.yml'
  workflow_dispatch:

# Der Test-Report erscheint als eigener Check beim Commit und braucht dafuer Schreibrechte.
permissions:
  contents: read
  checks: write

env:
  MAVEN_OPTS_CLI: --batch-mode --no-transfer-progress
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:

  backend:
    name: backend (Unit + Integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Yahoot/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Tests und Coverage
        run: mvn $MAVEN_OPTS_CLI verify
      - name: Report in die Zusammenfassung
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend-Tests
          path: Yahoot/backend/target/*-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
      - name: Reports ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            Yahoot/backend/target/surefire-reports/
            Yahoot/backend/target/failsafe-reports/
            Yahoot/backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: frontend (Unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Yahoot/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Yahoot/frontend/package-lock.json
      - run: npm ci
      - name: Tests und Coverage
        run: npm run test:ci
      - name: Report in die Zusammenfassung
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Frontend-Tests
          path: Yahoot/frontend/reports/junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
      - name: Reports ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            Yahoot/frontend/reports/
            Yahoot/frontend/coverage/
          if-no-files-found: warn

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Frontend bauen
        working-directory: Yahoot/frontend
        run: |
          npm ci
          npm run build
      - name: JAR mit Frontend bauen
        working-directory: Yahoot/backend
        run: mvn $MAVEN_OPTS_CLI -Pwith-frontend -DskipTests package
      - name: Playwright einrichten
        working-directory: Yahoot/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-End-Tests
        working-directory: Yahoot/e2e
        run: npm test
      - name: Report in die Zusammenfassung
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: End-to-End-Tests
          path: Yahoot/e2e/reports/junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
      - name: Reports ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            Yahoot/e2e/reports/
            Yahoot/e2e/test-results/
          if-no-files-found: warn

  deploy:
    name: deploy (Docker-Image)
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Bei GitHub Packages anmelden
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen, auf main auch veroeffentlichen
        uses: docker/build-push-action@v6
        with:
          context: Yahoot
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/david-tarlos/yahoot:latest
