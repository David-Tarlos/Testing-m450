spring.application.name=yahoot

# Hosting-Anbieter geben den Port oft ueber die Umgebungsvariable PORT vor.
server.port=${PORT:8080}

# Gehostet liegt die App hinter einem HTTPS-Proxy. Ohne das haelt sie den Browser fuer eine fremde
# Seite und lehnt den WebSocket ab.
server.forward-headers-strategy=framework

# Von hier darf sich ein Browser per WebSocket verbinden. Die eigene Adresse ist immer erlaubt,
# der Eintrag ist fuer "ng serve" auf Port 4200 waehrend der Entwicklung.
yahoot.allowed-origins=http://localhost:4200
